<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurti Returns - Smart Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: white;
            margin: 0; 
            padding: 20px 10px; 
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
        }
        h1 { margin-top: 0; font-size: 22px; color: #ffffff; margin-bottom: 5px; }
        p.subtitle { color: #aaaaaa; margin-bottom: 20px; font-size: 14px; }
        
        #scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 2px solid #333;
            min-height: 250px;
        }

        #reader { width: 100%; }

        #laser-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; 
            height: 100px;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .scan-laser {
            width: 100%;
            height: 2px;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            position: absolute;
            top: 50%;
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { transform: translateY(-45px); }
            50% { transform: translateY(45px); }
            100% { transform: translateY(-45px); }
        }
        
        #switch-lens-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #888;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            display: none; 
        }
        
        #status-banner { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            display: none; 
            word-wrap: break-word;
        }
        .status-syncing { background: #332b00; color: #ffd700; border: 1px solid #cca100; }
        .status-success { background: #003311; color: #00ff55; border: 1px solid #00cc44; }
        .status-error { background: #330000; color: #ff3333; border: 1px solid #cc0000; }
        
        .sku-display { font-family: monospace; font-size: 16px; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* 🔥 Pending List Styles 🔥 */
        #pending-container {
            margin-top: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            border: 1px solid #333;
            display: none;
        }
        #pending-container h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #ffaa00;
            display: flex;
            justify-content: space-between;
        }
        #pending-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #pending-list li {
            background: #2a2a2a;
            margin-bottom: 5px;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #ffaa00;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,170,0,0.3);
            border-radius: 50%;
            border-top-color: #ffaa00;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-icon { font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Returns Check-In</h1>
        <p class="subtitle">Focus barcode on the red line</p>
        
        <div id="scanner-wrapper">
            <div id="reader"></div>
            <div id="laser-box">
                <div class="scan-laser" id="laser"></div>
            </div>
            <button id="switch-lens-btn">🔄 Switch Lens</button>
        </div>
        
        <div id="status-banner"></div>

        <!-- Pending Items UI -->
        <div id="pending-container">
            <h3><span>⏳ Pending Sync</span> <span style="background:#ffaa00;color:#000;padding:2px 8px;border-radius:12px;font-size:14px;font-weight:bold;" id="pending-count">0</span></h3>
            <ul id="pending-list"></ul>
        </div>
    </div>

    <script>
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD92vWbUlvBAKiQ5ahPm2g4LC1EH4OuLiDTF-hXy7snC_j1bqk2TLv_PykWKMfcDtG/exec"; 
        
        const statusBanner = document.getElementById('status-banner');
        const laserBox = document.getElementById('laser-box');
        const laser = document.getElementById('laser');
        const switchBtn = document.getElementById('switch-lens-btn');
        const pendingContainer = document.getElementById('pending-container');
        const pendingList = document.getElementById('pending-list');
        const pendingCount = document.getElementById('pending-count');
        
        let isScanningProcessActive = false; 
        let pendingScans = []; // Data Store
        let isQueueProcessing = false; // Queue Lock
        
        let availableCameras = [];
        let currentCameraIndex = 0;
        let isCameraRunning = false;
        
        const beepSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const html5QrCode = new Html5Qrcode("reader");

        // --- LOCAL STORAGE (Save state if tab closed) ---
        function saveToLocalStorage() {
            localStorage.setItem('kurtiScans', JSON.stringify(pendingScans));
        }
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('kurtiScans');
            if (saved) {
                pendingScans = JSON.parse(saved);
                pendingScans.forEach(item => item.status = 'pending'); 
                renderPendingUI();
                processQueue(); 
            }
        }

        // --- UI RENDER FUNCTION ---
        function renderPendingUI() {
            if (pendingScans.length === 0) {
                pendingContainer.style.display = "none";
            } else {
                pendingContainer.style.display = "block";
                pendingCount.innerText = pendingScans.length; 
                pendingList.innerHTML = "";
                
                pendingScans.forEach(item => {
                    let li = document.createElement("li");
                    let icon = item.status === 'syncing' ? '<span class="spinner"></span>' : '<span class="status-icon">⏳</span>';
                    li.innerHTML = `<span>${item.sku}</span> ${icon}`;
                    pendingList.appendChild(li);
                });
            }
            saveToLocalStorage();
        }

        function showStatus(message, stateClass) {
            statusBanner.className = stateClass;
            statusBanner.innerHTML = message;
            statusBanner.style.display = "block";
        }

        // --- AUTO-RETRY QUEUE SYSTEM ---
        function processQueue() {
            if (isQueueProcessing || pendingScans.length === 0) return;
            
            if (!navigator.onLine) {
                showStatus("❌ No Internet. Waiting to retry...", "status-error");
                return;
            }

            isQueueProcessing = true;
            
            const itemIndex = pendingScans.findIndex(i => i.status === 'pending');
            if (itemIndex === -1) {
                isQueueProcessing = false;
                return;
            }

            const item = pendingScans[itemIndex];
            item.status = 'syncing'; 
            renderPendingUI();
            
            showStatus(`Syncing: <span class="sku-display">${item.sku}</span>`, 'status-syncing');

            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `sku=${encodeURIComponent(item.sku)}`
            })
            .then(() => {
                pendingScans = pendingScans.filter(i => i.id !== item.id);
                renderPendingUI();
                // ❌ Beep sound yahan se hata diya gaya hai
                showStatus(`✅ Saved: <span class="sku-display">${item.sku}</span>`, 'status-success');
                
                isQueueProcessing = false;
                processQueue(); 
            })
            .catch(error => {
                pendingScans[itemIndex].status = 'pending';
                renderPendingUI();
                showStatus(`❌ Network lost. Will auto-retry...`, 'status-error');
                
                isQueueProcessing = false;
                setTimeout(processQueue, 3000); 
            });
        }

        window.addEventListener('online', () => {
            showStatus("🟢 Internet Restored! Syncing...", "status-syncing");
            processQueue();
        });

        setInterval(processQueue, 5000); 

        // --- SCANNER FUNCTION ---
        function onScanSuccess(decodedText) {
            if (isScanningProcessActive) return;
            isScanningProcessActive = true;
            
            // ✅ BEEP SOUND YAHAN PLAY HOGA JAISE HI SCAN HOGA
            beepSound.play().catch(e => console.log("Audio prevented"));

            html5QrCode.pause();
            laser.style.animation = "none";
            laser.style.background = "#00ff00"; 
            laser.style.boxShadow = "0 0 10px #00ff00";

            // Queue me naya item add kiya
            pendingScans.push({ id: Date.now(), sku: decodedText, status: 'pending' });
            renderPendingUI();
            processQueue(); 

            // 0.5 sec me scanner agle kapde ke liye ready
            setTimeout(() => {
                laser.style.animation = "scan 2s infinite ease-in-out";
                laser.style.background = "#ff0000";
                laser.style.boxShadow = "0 0 10px #ff0000";
                isScanningProcessActive = false;
                html5QrCode.resume();
            }, 500);
        }

        // --- CAMERA SETUP ---
        const config = { 
            fps: 10, 
            qrbox: {width: 250, height: 100}, 
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.UPC_A
            ]
        };

        function startSpecificCamera(cameraId) {
            laserBox.style.display = "none";
            html5QrCode.start(cameraId, config, onScanSuccess)
            .then(() => {
                laserBox.style.display = "block";
                isCameraRunning = true;
            }).catch(err => {
                showStatus("❌ Camera Start Error.", "status-error");
            });
        }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                availableCameras = devices.filter(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('environment'));
                if (availableCameras.length === 0) availableCameras = devices;

                let primaryIndex = availableCameras.findIndex(c => c.label.includes('0'));
                currentCameraIndex = primaryIndex !== -1 ? primaryIndex : 0;

                if (availableCameras.length > 1) switchBtn.style.display = "block";
                
                startSpecificCamera(availableCameras[currentCameraIndex].id);
            }
        }).catch(err => {
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .then(() => { laserBox.style.display = "block"; });
        });

        switchBtn.addEventListener('click', () => {
            if (!isCameraRunning) return;
            currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
            html5QrCode.stop().then(() => {
                isCameraRunning = false;
                startSpecificCamera(availableCameras[currentCameraIndex].id);
            });
        });

        // Initialize App
        loadFromLocalStorage();

    </script>
</body>
</html>
